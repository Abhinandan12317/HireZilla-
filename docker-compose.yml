
services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: hirezilla-backend

    restart: unless-stopped

    ports:
      - "4000:4000"

    env_file:
      - .env.example

    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000

    volumes:
      - hirezilla-data:/app/data
      - hirezilla-storage:/app/private_storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: hirezilla-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      NODE_ENV: production
      PORT: 5173
      BACKEND_URL: http://backend:4000

    depends_on:
      - backend

volumes:
  hirezilla-data:
  hirezilla-storage: